# Gera os APKs (Passageiro e Motorista) no GitHub, de graça, sem instalar o Android Studio.
# Como usar: Actions → "Gerar APKs" → Run workflow. Ao terminar, baixe em "Artifacts" no fim da página.
name: Gerar APKs
on:
  workflow_dispatch:
  push:
    paths: ['frontend/**', 'android/**', '.github/workflows/apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [passageiro, motorista]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Montar projeto Android
        working-directory: android
        env: { APP: '${{ matrix.app }}' }
        run: |
          npm install --no-audit --no-fund
          node scripts/preparar.js
          npx cap add android
          node scripts/preparar.js
          npx cap sync android
      - name: Compilar APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/android/app/build/outputs/apk/debug/app-debug.apk pool-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: 'pool-${{ matrix.app }}', path: 'pool-${{ matrix.app }}.apk' }
