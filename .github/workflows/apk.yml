# Gera o APK do Motorista no GitHub, de graça, sem instalar o Android Studio.
# O passageiro usa só a página (navegador); para voltar a gerar o APK dele, ponha passageiro na lista app abaixo.
# Como usar: Actions → "Gerar APKs" → Run workflow. Ao terminar, baixe na página Releases (apk-<branch>) ou em "Artifacts".
name: Gerar APKs
on:
  workflow_dispatch:
  push:
    paths: ['frontend/**', 'android/**', '.github/workflows/apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [motorista]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Montar projeto Android
        working-directory: android
        env: { APP: '${{ matrix.app }}' }
        run: |
          npm install --no-audit --no-fund
          node scripts/preparar.js
          npx cap add android
          node scripts/preparar.js
          npx cap sync android
      - name: Compilar APK
        working-directory: android/android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/android/app/build/outputs/apk/debug/app-debug.apk pool-${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: 'pool-${{ matrix.app }}', path: 'pool-${{ matrix.app }}.apk' }
  # Publica o APK numa "release" do GitHub: dá para baixar direto no celular, sem zip.
  # Um link fixo por branch: .../releases/download/apk-<branch>/pool-motorista.apk
  publicar:
    needs: apk
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publicar release
        env: { GH_TOKEN: '${{ github.token }}', TAG: 'apk-${{ github.ref_name }}' }
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create "$TAG" pool-*.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "APKs ($GITHUB_REF_NAME)" --notes "Gerado automaticamente a partir de $GITHUB_SHA."
