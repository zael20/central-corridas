# Assistente da central (rádio e app).
# É AQUI que a IA é "treinada": frases que ela reconhece, o que ela responde e os limites de alerta.
# Depois de editar, salve o arquivo. O servidor recarrega sozinho em até 5 s (ou use Central → Assistente → Recarregar).
# Nada no aplicativo (frontend) precisa mudar.
#
# Variáveis que podem ser usadas nas respostas (entre chaves):
#   {nome} primeiro nome · {matricula} · {origem} · {destino} · {veiculo} número do carro · {motorista}
#   {min} minutos até chegar (número) · {minutos} "1 minuto"/"5 minutos" · {hora} hora prevista · {posicao} posição na fila · {antes} atendimentos antes
#   {onde} local mais próximo do carro · {km} distância até você · {parado_min} minutos parado
#   {resposta_motorista} o que o motorista respondeu · {status} situação da corrida · {hora_fim} hora que terminou

# ------------------------------------------------------------------
# Intenções: o que a pessoa quer. A primeira lista em que alguma expressão aparecer no texto vence
# (texto comparado sem acento e em minúsculas; palavras longas toleram 1 letra errada). Ordem importa.
# Além das listas, a central olha a situação da viagem da pessoa: se a viagem já começou e ela diz que
# "ainda está esperando", vira "nao_embarquei"; se ela já tem viagem aberta e "pede" de novo o mesmo trajeto,
# vira "informacao" (não cria pedido duplicado). "nao_embarquei" e "nao_encontrei" com viagem que ainda não
# começou respondem a situação da viagem, então frases mais amplas nessas listas não fazem estrago.
intencoes:
